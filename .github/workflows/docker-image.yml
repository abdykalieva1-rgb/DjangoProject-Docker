name: Docker Image CI

on:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Build and Test
      run: |
        # Собираем образ
        docker build . -t test-container
        # Запускаем проверку Django
        docker run test-container python manage.py check
        # Запускаем тесты
        docker run test-container python manage.py test
